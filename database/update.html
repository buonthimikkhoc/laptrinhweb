<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Cập nhật User</title>

<link rel="stylesheet" href="style.css">

<style>

.update-box{
width:400px;
margin:auto;
margin-top:100px;
padding:30px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.5);
border-radius:20px;
backdrop-filter:blur(15px);
color:white;
}

.update-box h2{
text-align:center;
margin-bottom:20px;
}

.update-box label{
display:block;
margin-top:10px;
}

.update-box input{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
outline:none;
}

.update-box button{
margin-top:20px;
width:100%;
padding:10px;
border:none;
border-radius:30px;
background:white;
cursor:pointer;
font-weight:bold;
}

.update-box button:hover{
background:#ddd;
}

.back-link{
text-align:center;
margin-top:15px;
}

.back-link a{
color:white;
text-decoration:none;
}

.back-link a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<section>

<div class="update-box">

<h2>Cập nhật User</h2>

<label>Username</label>
<input type="text" value="xxx">

<label>Mật khẩu</label>
<input type="password" value="xxx">

<label>Nhập lại mật khẩu</label>
<input type="password" value="xxx">

<label>Email</label>
<input type="text" value="xxx">

<button>Cập nhật</button>

<div class="back-link">
<a href="list.html">Quay lại danh sách</a>
</div>

</div>

</section>

</body>
</html>
