<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang chủ</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:30px;
    color:#333;
}

.menu a{
    display:block;
    margin:10px 0;
    padding:12px;
    text-decoration:none;
    color:white;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.login{
    background:#4CAF50;
}

.register{
    background:#2196F3;
}

.list{
    background:#ff9800;
}

.menu a:hover{
    transform:scale(1.05);
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">
    <h1>Trang chủ</h1>

    <div class="menu">
        <a class="login" href="login.html">Login</a>
        <a class="register" href="register.html">Register</a>
        <a class="list" href="list.html">User List</a>
    </div>
</div>

</body>
</html>
