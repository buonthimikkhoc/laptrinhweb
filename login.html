<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="public/css/style.css">
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#f3f3f3;
        }

        .container{
            width: 900px;
            margin: 30px auto;
            background:#fff;
            border:1px solid #999;
            padding: 20px;
        }

        .header,
        .footer{
            border:1px solid #999;
            text-align:center;
            padding:12px 10px;
            font-size:14px;
        }

        .header{
            margin-bottom:40px;
        }

        .footer{
            margin-top:40px;
        }

        .header a{
            text-decoration:none;
            color:#000;
            margin:0 6px;
        }

        .header a.active{
            font-weight:bold;
        }

        .content{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:260px;
        }

        .login-box{
            width: 420px;
            border:1px solid #999;
            padding:35px 40px;
        }

        .login-box h2{
            text-align:center;
            margin:0 0 30px;
            font-size:32px;
            font-weight:500;
            color:#333;
        }

        .form-row{
            display:flex;
            align-items:center;
            margin-bottom:20px;
        }

        .form-row label{
            width:110px;
            font-size:15px;
            color:#333;
        }

        .form-row input[type="text"],
        .form-row input[type="password"]{
            flex:1;
            height:34px;
            border:1px solid #999;
            padding:0 10px;
            outline:none;
        }

        .remember{
            display:flex;
            align-items:center;
            margin:10px 0 25px 110px;
            font-size:14px;
            color:#333;
            gap:8px;
        }

        .actions{
            display:flex;
            justify-content:flex-end;
            align-items:center;
            gap:20px;
            margin-top:10px;
        }

        .forgot{
            text-decoration:none;
            color:#6c8fcf;
            font-size:14px;
        }

        .btn-login{
            background:#0d6efd;
            color:#fff;
            border:none;
            padding:10px 18px;
            border-radius:4px;
            cursor:pointer;
            font-size:14px;
        }

        .btn-login:hover{
            opacity:0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">Home</a> |
            <a href="login.html" class="active">Đăng nhập</a> |
            <a href="register.html">Đăng ký</a>
        </div>

        <div class="content">
            <div class="login-box">
                <h2>Màn hình đăng nhập</h2>

                <div class="form-row">
                    <label for="username">Username</label>
                    <input type="text" id="username">
                </div>

                <div class="form-row">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password">
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ghi nhớ đăng nhập</label>
                </div>

                <div class="actions">
                    <a href="#" class="forgot">Quên mật khẩu</a>
                    <button class="btn-login">Đăng nhập</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Lập trình web @01/2024
        </div>
    </div>
</body>
</html>
