<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cập nhật</title>

<link rel="stylesheet" href="public/css/style.css">

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f3f3f3;
}

.container{
    width:900px;
    margin:30px auto;
    background:#fff;
    border:1px solid #999;
    padding:20px;
}

.header,.footer{
    border:1px solid #999;
    text-align:center;
    padding:12px;
    font-size:14px;
}

.header{ margin-bottom:40px; }
.footer{ margin-top:40px; }

.header a{
    text-decoration:none;
    color:#000;
    margin:0 6px;
}

.content{
    display:flex;
    justify-content:center;
    align-items:center;
}

.update-box{
    width:420px;
    border:1px solid #999;
    padding:35px 40px;
}

.update-box h2{
    text-align:center;
    margin-bottom:30px;
    font-size:28px;
    color:#333;
}

.form-row{
    display:flex;
    align-items:center;
    margin-bottom:18px;
}

.form-row label{
    width:140px;
    font-size:14px;
}

.form-row input{
    flex:1;
    height:34px;
    border:1px solid #999;
    padding:0 10px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:20px;
    margin-top:25px;
}

.login-link{
    text-decoration:none;
    color:#6c8fcf;
    font-size:14px;
}

.btn{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
}

.btn:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <a href="index.html">Home</a> |
        <a href="login.html">Đăng nhập</a> |
        <a href="register.html">Đăng ký</a>
    </div>

    <div class="content">

        <div class="update-box">
            <h2>Màn hình cập nhật</h2>

            <div class="form-row">
                <label>Username</label>
                <input type="text" value="xxx">
            </div>

            <div class="form-row">
                <label>Mật khẩu</label>
                <input type="password" value="xxx">
            </div>

            <div class="form-row">
                <label>Nhập lại mật khẩu</label>
                <input type="password" value="xxx">
            </div>

            <div class="form-row">
                <label>Email</label>
                <input type="email" value="xxx">
            </div>

            <div class="actions">
                <a href="login.html" class="login-link">Đã có tài khoản</a>
                <button class="btn">Cập nhật</button>
            </div>

        </div>

    </div>

    <div class="footer">
        Lập trình web @01/2024
    </div>

</div>

</body>
</html>
