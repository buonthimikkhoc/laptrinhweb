
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết user</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f3f3f3;
}

.container{
    width:900px;
    margin:30px auto;
    background:#fff;
    border:1px solid #999;
    padding:20px;
}

.header,.footer{
    border:1px solid #999;
    text-align:center;
    padding:12px;
}

.header{ margin-bottom:40px; }
.footer{ margin-top:40px; }

.header a{
    text-decoration:none;
    color:#000;
    margin:0 5px;
}

.content{
    display:flex;
    justify-content:center;
    align-items:center;
}

.view-box{
    width:400px;
    border:1px solid #999;
    padding:35px 30px;
    text-align:left;
}

.view-box h2{
    text-align:center;
    margin-bottom:30px;
    font-size:24px;
}

.info-row{
    display:flex;
    margin-bottom:15px;
}

.info-row label{
    width:120px;
    font-weight:bold;
}

.actions{
    text-align:center;
    margin-top:25px;
}

.btn{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
}

.btn:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">

    <div class="header">
        <a href="index.html">Home</a> |
        <a href="#">Đăng xuất</a>
    </div>

    <div class="content">

        <div class="view-box">
            <h2>Màn hình chi tiết</h2>

            <div class="info-row">
                <label>Username</label>
                <div>test1</div>
            </div>

            <div class="info-row">
                <label>Email</label>
                <div>test1@gmail.com</div>
            </div>

            <div class="actions">
                <a href="update.html">
                    <button class="btn">Chỉnh sửa</button>
                </a>
            </div>

        </div>

    </div>

    <div class="footer">
        Lập trình web @01/2024
    </div>

</div>

</body>
</html>
